[project]
name = "sago-agent"
version = "0.1.5"
description = "Sophisticated Multi-Agent Orchestration System with infinite tools, cross-platform support, and TUI interface"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "CrimsonDevil333333", email = "satyaagoyal333333@gmail.com" }
]
keywords = ["ai", "agents", "multi-agent", "orchestration", "tui", "llm", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.4.2",
    "crewai[google-genai]>=1.15.13",
    "crewai-tools>=1.15.13",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langgraph>=0.4.0",
    "paramiko>=5.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.4",
    "textual>=8.2.8",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8.0", "langchain-google-genai>=2.0.0"]
openai = ["langchain-openai>=0.3.0"]
claude = ["anthropic>=0.40.0", "langchain-anthropic>=0.3.0"]
ollama = ["langchain-community>=0.3.0"]
dev = ["ruff>=0.8.0", "mypy>=1.13.0", "pytest>=8.0.0", "pytest-cov>=5.0.0", "build>=1.2.0", "twine>=5.0.0"]

[project.scripts]
sago = "sago.main:main"

[project.urls]
Homepage = "https://github.com/SAGO-AUTOMATES/SAGO-Agent"
Repository = "https://github.com/SAGO-AUTOMATES/SAGO-Agent"
Issues = "https://github.com/SAGO-AUTOMATES/SAGO-Agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sago"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
