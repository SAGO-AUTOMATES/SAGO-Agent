# =============================================================================
# SAGO MASTER CONFIGURATION
# =============================================================================
# This is the complete configuration file for the Sago multi-agent system.
# All options have sensible defaults. Uncomment and modify as needed.
#
# Location: ~/.sago/config/sago.yaml
# Docs: See docs/CONFIGURATION.md for full guide
# =============================================================================

# -----------------------------------------------------------------------------
# PROJECT METADATA
# -----------------------------------------------------------------------------
project:
  name: "sago"
  version: "0.1.13"
  environment: "development"  # development, staging, production
  description: "Sophisticated Multi-Agent Orchestration System"

# -----------------------------------------------------------------------------
# ORCHESTRATOR CONFIGURATION
# The master agent that routes tasks to specialist agents.
# -----------------------------------------------------------------------------
orchestrator:
  name: "Sago"
  description: "Master orchestrator that routes tasks to specialist agents"
  model: null  # null = use settings.json model, or specific: "gemini-2.5-flash", "gpt-4o"
  max_iterations: 25       # Max loops before forcing completion
  verbose: true            # Show detailed execution logs
  memory: true             # Enable conversation memory
  planning: true           # Enable task planning before execution

# -----------------------------------------------------------------------------
# GLOBAL SETTINGS
# Core system behavior settings.
# -----------------------------------------------------------------------------
settings:
  # --- OS & Shell ---
  auto_detect_os: true           # Auto-detect OS for platform-specific behavior
  preferred_shell: null          # null = auto-detect, or "bash", "zsh", "powershell", "cmd"

  # --- Execution ---
  max_concurrent_tools: 5        # Max tools running in parallel
  tool_timeout_seconds: 300      # Timeout per tool execution (5 min)
  retry_on_failure: true         # Auto-retry failed tool calls
  max_retries: 3                 # Number of retry attempts

  # --- Logging ---
  log_level: "INFO"              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_to_file: true              # Write logs to file (not just console)
  log_directory: "~/.sago/logs"  # Log file location

  # --- Sessions ---
  session_persistence: true      # Save sessions to disk
  session_directory: "~/.sago/sessions"  # Session storage location
  max_session_history: 100       # Max messages to keep per session

  # --- Output ---
  verbose_output: false          # Show verbose output in TUI
  color_output: true             # Enable colored terminal output
  markdown_output: true          # Render markdown in responses

  # --- Developer ---
  dev_mode: true                 # TODO: flip to false at 1.0 — default ON until beta (shows Inspector without /dev on)

# -----------------------------------------------------------------------------
# AGENT CONFIGURATION
# Enable/disable agents and set per-agent overrides.
# -----------------------------------------------------------------------------
agents:
  # List of enabled agents (only these will be used)
  enabled:
    - sago            # Master orchestrator (always enabled)
    - coder           # Code writing and modification
    - debugger        # Bug identification and fixing
    - architect       # System design and architecture
    - devops          # Infrastructure and deployment
    - reviewer        # Code review and quality
    - researcher      # Information gathering and analysis
    - planner         # Task planning and breakdown

  # Per-agent overrides (optional)
  overrides:
    coder:
      model: null              # null = use orchestrator default
      max_iterations: 15
      verbose: null            # null = use orchestrator default
    debugger:
      model: null
      max_iterations: 20
    architect:
      model: null
      max_iterations: 10

# -----------------------------------------------------------------------------
# TOOL CONFIGURATION
# Enable/disable tool categories.
# -----------------------------------------------------------------------------
tools:
  categories:
    file: true       # File operations (read, write, edit, search)
    shell: true      # Shell command execution
    ssh: true        # SSH remote operations
    session: true    # Session management
    coding: true     # Code analysis and formatting
    network: true    # Network operations (HTTP, DNS, ports)
    admin: true      # Administrative operations (sudo, packages)
    system: true     # System operations (Docker, K8s, processes)

# -----------------------------------------------------------------------------
# LLM PROVIDER CONFIGURATION
# Configure which AI models to use.
# -----------------------------------------------------------------------------
llm_providers:
  default: "gemini"  # Default provider: gemini, openai, claude, openrouter, ollama

  providers:
    gemini:
      enabled: true
      api_key_env: "GEMINI_API_KEY"    # Environment variable holding API key
      model: "gemini-2.5-flash"        # Model name
      max_tokens: 8192                 # Max response tokens
      temperature: 0.7                 # Randomness (0.0-1.0)

    openai:
      enabled: true
      api_key_env: "OPENAI_API_KEY"
      model: "gpt-4o"
      max_tokens: 4096
      temperature: 0.7

    claude:
      enabled: true
      api_key_env: "ANTHROPIC_API_KEY"
      model: "claude-sonnet-4-20250514"
      max_tokens: 4096
      temperature: 0.7

    openrouter:
      enabled: false
      api_key_env: "OPENROUTER_API_KEY"
      model: "anthropic/claude-sonnet-4"
      max_tokens: 4096
      temperature: 0.7

    ollama:
      enabled: false
      base_url: "http://localhost:11434"  # Local Ollama server
      model: "llama3.1"
      max_tokens: 4096
      temperature: 0.7

# -----------------------------------------------------------------------------
# TASK ROUTING
# Keywords that trigger specific agents.
# -----------------------------------------------------------------------------
routing:
  triggers:
    coder:
      - "write code"
      - "implement"
      - "create function"
      - "add feature"
      - "refactor"
      - "code"
      - "program"
      - "script"

    debugger:
      - "debug"
      - "fix bug"
      - "error"
      - "exception"
      - "crash"
      - "not working"
      - "broken"
      - "issue"

    architect:
      - "design"
      - "architecture"
      - "system design"
      - "structure"
      - "pattern"
      - "scale"
      - "planning"

    devops:
      - "deploy"
      - "docker"
      - "kubernetes"
      - "ci/cd"
      - "pipeline"
      - "infrastructure"
      - "server"
      - "cloud"

    reviewer:
      - "review"
      - "check"
      - "audit"
      - "quality"
      - "best practice"
      - "optimize"

    researcher:
      - "research"
      - "find"
      - "search"
      - "compare"
      - "evaluate"
      - "analyze"

    planner:
      - "plan"
      - "break down"
      - "steps"
      - "roadmap"
      - "milestone"
      - "task"

# -----------------------------------------------------------------------------
# HYBRID SEARCH CONFIGURATION
# For codebase indexing and search.
# -----------------------------------------------------------------------------
search:
  max_files: 50000               # Max files to index
  use_embeddings: false          # Use AI embeddings for search (requires API)
  cache_dir: "~/.sago/cache/hybrid_index"  # Index cache location

# -----------------------------------------------------------------------------
# DAEMON SERVER CONFIGURATION
# Background server for persistent operations.
# -----------------------------------------------------------------------------
daemon:
  host: "127.0.0.1"             # Bind address (localhost only for security)
  port: 7654                     # Server port
  max_connections: 10            # Max concurrent connections

# -----------------------------------------------------------------------------
# P2P MESH NETWORK CONFIGURATION
# For multi-agent communication.
# -----------------------------------------------------------------------------
mesh:
  port: 7655                     # Mesh network port
  task_timeout_seconds: 120      # Timeout for delegated tasks

# -----------------------------------------------------------------------------
# EXECUTION ENGINE CONFIGURATION
# Fine-tune task execution behavior.
# -----------------------------------------------------------------------------
executor:
  project_context_ttl: 300       # Seconds to cache project context
  max_tokens: 32000              # Max tokens per execution
  circular_detection_threshold: 5  # Detect circular agent calls — was 3 (too strict, killed legit multi-file reads)
  auto_complete_min_tools: 5     # Min tools used for auto-completion
  auto_complete_min_success: 3   # Min successful tools for auto-completion
  auto_complete_min_iterations: 4  # Min iterations for auto-completion
