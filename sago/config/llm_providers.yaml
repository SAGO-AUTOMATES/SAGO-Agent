# LLM Provider Configuration
# ==========================
# Configure LLM providers for Sago agents.

llm_providers:
  default: "gemini"

  providers:
    gemini:
      enabled: true
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-2.0-flash"
      max_tokens: 8192
      temperature: 0.7

    openai:
      enabled: true
      api_key_env: "OPENAI_API_KEY"
      model: "gpt-4o"
      max_tokens: 4096
      temperature: 0.7

    claude:
      enabled: true
      api_key_env: "ANTHROPIC_API_KEY"
      model: "claude-sonnet-4-20250514"
      max_tokens: 4096
      temperature: 0.7

    openrouter:
      enabled: false
      api_key_env: "OPENROUTER_API_KEY"
      model: "anthropic/claude-sonnet-4"
      max_tokens: 4096
      temperature: 0.7

    ollama:
      enabled: false
      base_url: "http://localhost:11434"
      model: "llama3.1"
      max_tokens: 4096
      temperature: 0.7
